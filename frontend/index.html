<!doctype html>
<html lang="zh-CN"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'self'; connect-src 'none'; object-src 'none'; base-uri 'none'; form-action 'none'">
<title>财报研究底稿</title><link rel="stylesheet" href="styles.css"><script src="app.js" defer></script>
</head><body><main>
<header><span>RESEARCH / EVIDENCE FIRST</span><h1>财报研究底稿</h1><p>查看事实，核对证据，识别尚未解决的问题。</p></header>
<section class="notice">本地只读 · 文件不上传 · 不调用模型 · 不构成投资建议</section>
<section><label for="file">选择分析产物 result.json</label><input id="file" type="file" accept=".json,application/json"><p>服务端只运行分析任务。下载结果到自己的电脑，即可离线查看。</p></section>
<p id="message" role="status" aria-live="polite">尚未加载文件。</p>
<div id="results" hidden>
<section class="overview"><div>任务<strong id="run"></strong></div><div>状态<strong id="status"></strong></div><div>模式<strong id="mode"></strong></div></section>
<section><h2>需复核的问题</h2><ul id="issues"></ul></section>
<section><h2>财务事实</h2><p>validated 不代表已核实公司身份、公告时间或投资价值。</p><div class="scroll"><table><thead><tr><th>指标</th><th>数值</th><th>单位 / 币种</th><th>期间 / 口径</th><th>状态</th><th>证据</th></tr></thead><tbody id="facts"></tbody></table></div></section>
<section><h2>风险规则</h2><p>无法评估不等于低风险，分数不是收益预测。</p><ul id="rules"></ul></section>
<section><h2>原始证据</h2><div id="evidence"></div></section>
</div></main></body></html>
